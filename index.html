      (() => {
        let nightMode;
        try { nightMode = JSON.parse(localStorage.getItem('qessa_family_night_v2')); } catch {}

        const prefersNight = typeof nightMode === 'boolean' ? nightMode : hour >= 20 || hour < 6;
        document.documentElement.classList.toggle('dark', prefersNight);
      })();
    </script>
